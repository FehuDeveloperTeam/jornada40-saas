<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"></head>
<body style="font-family:Arial,sans-serif;background:#f4f6f9;margin:0;padding:0;">
  <div style="max-width:520px;margin:40px auto;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.08);">
    <div style="background:linear-gradient(135deg,#0c1a35,#1e3a6e);padding:28px 36px;">
      <h1 style="color:#fff;margin:0;font-size:20px;font-weight:700;">Tu código de acceso</h1>
      <p style="color:rgba(255,255,255,0.65);margin:6px 0 0;font-size:14px;">Portal del trabajador · Jornada40</p>
    </div>
    <div style="padding:32px 36px;">
      <p style="color:#374151;font-size:14px;margin:0 0 22px;line-height:1.6;">Ingresa este código para ver tus liquidaciones y documentos laborales:</p>
      <div style="text-align:center;margin:0 0 24px;">
        <div style="display:inline-block;background:#f0f4ff;border:2px dashed #2563eb;border-radius:12px;padding:18px 36px;">
          <span style="font-size:36px;font-weight:900;letter-spacing:0.3em;color:#1e3a6e;font-family:monospace;">{{ codigo }}</span>
        </div>
        <p style="color:#6b7280;font-size:13px;margin:10px 0 0;">Vence en <strong>{{ minutos }} minutos</strong></p>
      </div>
      <p style="color:#9ca3af;font-size:12px;margin:0;line-height:1.6;">Si no lo pediste, ignora este mensaje: nadie puede entrar sin este código.</p>
    </div>
  </div>
</body>
</html>
